<center>

    <h1>Student Registration Form</h1>

        <input type="hidden"

               value="student_registration">

        <label for="fullname">Full Name:</label>
        <input type="text"
               id="fullname"
               name="fullname"
               placeholder="Enter your full name"
               required>

        <br><br>

        <!-- Number -->
        <label for="age">Age:</label>
        <input type="number"
               id="age"
               name="age"
               placeholder="Enter number"
               min="1"
               max="100">

        <br><br>

        <!-- Month Picker -->
        <label for="month">Month Picker:</label>
        <input type="month"
               id="month"
               name="month">

        <!-- Time Picker -->
        <label for="time">Time Picker:</label>
        <input type="time"
               id="time"
               name="time">

        <br><br>

        <!-- Date Picker -->
        <label for="date">Date Picker:</label>
        <input type="date"
               id="date"
               name="date">

        <br><br>

        <!-- Date Time Picker -->
        <label for="datetime">Date & Time Picker:</label>
        <input type="datetime-local"
               id="datetime"
               name="datetime">

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password"
